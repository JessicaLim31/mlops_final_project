apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqs-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sqs-consumer
  template:
    metadata:
      labels:
        app: sqs-consumer
    spec:
      containers:
        - name: consumer
          image: YOUR_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/sqs-consumer:latest
          env:
            - name: QUEUE_URL
              value: "https://sqs.us-east-1.amazonaws.com/YOUR_ACCOUNT/your-queue"

            - name: S3_BUCKET
              value: "mlops-final-project331"

            - name: S3_MODEL_KEY
              value: "models/latest/model.pkl"

            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            